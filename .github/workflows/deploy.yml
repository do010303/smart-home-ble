name: Test & deploy

# Mỗi lần push lên main: chạy unit test, đạt thì đưa bản mới sang nhánh gh-pages
# (GitHub Pages phục vụ nhánh này tại https://<user>.github.io/<repo>/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit test
        run: node tests/model_test.mjs

      - name: Deploy lên gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
