name: Test & deploy

# Mỗi lần push lên main: chạy unit test + E2E (Playwright), đạt thì đưa bản mới sang nhánh gh-pages
# (GitHub Pages phục vụ nhánh này tại https://<user>.github.io/<repo>/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-24.04  # có sẵn Google Chrome cho E2E
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit test (màu, gói tin, tài khoản, thiết kế nhà)
        run: npm test

      - name: Cài Playwright (dùng Google Chrome có sẵn trên máy chạy)
        run: |
          npm ci
          google-chrome --version

      - name: E2E test theo kịch bản khách hàng (máy tính + điện thoại)
        run: npx playwright test

      - name: Lưu báo cáo E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Deploy lên gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
